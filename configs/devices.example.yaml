# Copy this file to devices.local.yaml and fill in real device details.
# Do not commit files containing passwords, tokens, or private IP mappings.

# Dashboard login credentials. Remove this section to disable authentication.
dashboard_auth:
  username: admin
  password: change_me

tplink:
  switches:
    - name: living_room_switch
      host: 192.168.1.10
      model: HS200
      # For newer Kasa/Tapo devices, prefer TPLINK_USERNAME and TPLINK_PASSWORD
      # environment variables instead of putting credentials in this file.

  cameras:
    - name: family_room_camera
      host: 192.168.0.24
      model: Tapo C200
      room: Family Room
      stream_name: family_room_camera
      go2rtc_url: http://192.168.0.176:1984
      # Browser-viewable camera sources:
      # - snapshot_url for an HTTP/JPEG snapshot endpoint
      # - stream_url for a browser-playable HTTP/HLS/MJPEG stream
      # - view_url for a camera web page or proxy URL
      # snapshot_url: http://192.168.0.24/snapshot.jpg
      # Raw RTSP cannot play directly in a browser. The Pi web app proxies this to MJPEG with ffmpeg.
      username_env: TAPO_CAMERA_USERNAME
      password_env: TAPO_CAMERA_PASSWORD
      # /stream2 is the lower-bandwidth Tapo substream and is smoother for dashboard viewing.
      stream_path: /stream2
      mjpeg_fps: 10
      mjpeg_width: 640
      mjpeg_quality: 7
    # Additional Tapo cameras follow the same pattern. Reuse the shared
    # TAPO_CAMERA_USERNAME / TAPO_CAMERA_PASSWORD env vars (the camera-account
    # credentials set in the Tapo app) unless the camera has its own account.
    - name: bedroom_camera
      host: 192.168.0.25
      model: Tapo C210
      room: Bedroom
      stream_name: bedroom_camera
      go2rtc_url: http://192.168.0.176:1984
      username_env: TAPO_CAMERA_USERNAME
      password_env: TAPO_CAMERA_PASSWORD
      stream_path: /stream2
      mjpeg_fps: 10
      mjpeg_width: 640
      mjpeg_quality: 7

media_gateway:
  go2rtc_url: http://192.168.0.176:1984

cameras:
  - name: wyze_camera
    provider: wyze
    host: 192.168.0.95
    model: Wyze RTSP
    room: Garage
    stream_name: wyze_camera
    go2rtc_url: http://192.168.0.176:1984
    username_env: WYZE_RTSP_USERNAME
    password_env: WYZE_RTSP_PASSWORD
    rtsp_scheme: rtsps
    rtsp_port: 322
    stream_path: /stream0
    go2rtc_source: ffmpeg
  - name: chortau_camera_1
    provider: chortau
    host: 192.168.0.57
    model: Hipcam RealServer
    room: Home
    stream_name: chortau_camera_1
    go2rtc_url: http://192.168.0.176:1984
    username_env: CHORTAU_CAMERA_USERNAME
    password_env: CHORTAU_CAMERA_PASSWORD
    rtsp_port: 554
    stream_path: /11
  - name: chortau_camera_2
    provider: chortau
    host: 192.168.0.191
    model: Hipcam RealServer
    room: Home
    stream_name: chortau_camera_2
    stream_url: rtsp://192.168.0.191:554/11
    go2rtc_enabled: false
    mjpeg_fps: 8
    mjpeg_width: 640
    mjpeg_quality: 7

weather:
  name: Home
  latitude: 49.2827
  longitude: -123.1207
  timezone: America/Vancouver
  temperature_unit: celsius

ecobee:
  temperature_unit: celsius
  thermostats:
    - name: Main thermostat
      # thermostat_id is optional if your Ecobee account has only one thermostat.
      thermostat_id: replace_me
      room: Hallway

home_assistant:
  base_url: http://127.0.0.1:8123
  token_env: HOME_ASSISTANT_TOKEN
  include_domains:
    - climate
    - light
    - switch
    - sensor
    - binary_sensor
    - cover
    - fan
    - lock

tuya:
  devices:
    - name: hallway_motion_sensor
      device_id: replace_me
      host: 192.168.1.30
      local_key_env: TUYA_HALLWAY_MOTION_LOCAL_KEY
      category: tuya_sensor
      room: Hallway
      model: Motion Sensor
      dps:
        motion: "1"
        battery: "4"
    - name: porch_outlet
      device_id: replace_me
      host: 192.168.1.31
      local_key_env: TUYA_PORCH_OUTLET_LOCAL_KEY
      category: tuya_switch
      room: Porch
      model: Smart Plug
      power_dp: "1"

ambient_lights:
  devices:
    - name: Govee H613A Strip
      provider: govee_ble
      model: H613A
      room: Living Room
      # Run scripts/discover-govee-ble.py on the Raspberry Pi and paste the BLE address here.
      address: replace_me
    - name: Govee H6054 Light
      provider: govee_ble
      model: H6054
      room: Bedroom
      address: replace_me
    # Newer Govee models (e.g. H6076 Lyra) ignore the legacy BLE protocol; control
    # them over Wi-Fi instead. Enable "LAN Control" in the Govee app (2.4GHz Wi-Fi,
    # firmware 1.04.06+). The Pi finds the device by LAN scan and matches on the
    # address (device id suffix) or model, so no static IP is needed.
    - name: Govee H6076 Floor Lamp
      provider: govee_lan
      model: H6076
      room: Living Room
      address: replace_me
    # Lepro S1 stays display-only: its BLE protocol is encrypted (handshake-gated),
    # so the dashboard cannot send it commands. See
    # docs/superpowers/specs/2026-07-18-lepro-govee-ble-design.md.
    - name: Lepro S1 AI LED
      provider: alexa
      model: Lepro S1 AI LED
      room: Studio
      alexa_name: Lepro S1 AI LED

humidifiers:
  devices:
    # Govee humidifiers are controlled through the Govee Developer API v2.
    # Apply for a key in the Govee app (Settings -> Apply for API Key) and set
    # it as the GOVEE_API_KEY environment variable on the Pi — never here.
    # device_id is the "device" value from the Govee API device list. Leave
    # replace_me and the app matches by model when the account has exactly
    # one device of that model.
    - name: Bedroom Humidifier
      provider: govee_cloud
      model: H7140
      room: Bedroom
      device_id: replace_me
      # The card shows ambient temperature/humidity from a linked Govee
      # thermometer. Without an explicit id the app falls back to "the only
      # humidity sensor on the account". That fallback resolves cleanly when
      # there is exactly one humidity sensor, OR when every extra one also
      # reports carbonDioxideConcentration (e.g. an H5140 CO2 combo monitor,
      # like the one in the environment: section below) — the app's tie-break
      # excludes CO2-reporting sensors from the ambiguous set. It does NOT
      # resolve if you add a second plain (non-CO2) humidity sensor. Don't
      # depend on that tie-break holding — pin the thermometer explicitly.
      # Find the id with:
      #   GOVEE_API_KEY=... python3 scripts/probe-govee-cloud-device.py H5179
      thermometer_device_id: replace_me
      thermometer_model: H5179

environment:
  # Standalone temperature/humidity sensors read through the Govee Developer
  # API v2. Same GOVEE_API_KEY as the humidifiers above — set it in the
  # environment on the Pi, never here.
  sensors:
    # device_id is the "device" value from the Govee API device list; find it
    # with: GOVEE_API_KEY=... python3 scripts/probe-govee-cloud-device.py H5140
    # Leave replace_me and the app matches by model when the account has
    # exactly one device of that model.
    - name: Bedroom Thermo-Hygrometer
      provider: govee_cloud
      model: H5140
      room: Bedroom
      device_id: replace_me

mqtt:
  broker_host: 127.0.0.1
  broker_port: 1883

matter:
  # server_url defaults to ws://localhost:5580/ws
  # server_url: ws://localhost:5580/ws
  devices:
    # Written automatically when you commission a device from the dashboard.
    # Optional: add category override (light_switch / smart_plug / tuya_sensor).
    # - node_id: 1
    #   name: Kitchen Switch
    #   room: Kitchen

home_assistant_devices:
  # Written automatically when you confirm a new-device popup on the dashboard.
  # entity_id must match a Home Assistant light/switch entity_id.
  # category is either light_switch (Lights view) or smart_plug (Plugs view).
