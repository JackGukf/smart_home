# A button on a remote page (Wall panel, TV cast) that sends one command to that
# screen: a Home Assistant event with one field, which the dashboard checks
# against its own list and forwards to that screen's browser only
# (web_app.py, _REMOTE_FRAMES). Included with vars:
#   remote         wall or tv: the page's ids (${remote}_toast)
#   key            a unique id stem
#   text           the label (LVGL symbols allowed)
#   event          the Home Assistant event (must start with "esphome.")
#   field, value   the event's one field
#   toast          what the page's message line says afterwards
#   x, y, width
obj:
  id: ${remote}_${key}_btn
  x: ${x}
  y: ${y}
  width: ${width}
  height: 54
  radius: 14
  pad_all: 0
  border_width: 0
  bg_color: 0x3E444E
  bg_opa: 74%
  scrollable: false
  pressed:
    bg_color: 0x647696
    bg_opa: 90%
  on_click:
    - homeassistant.event:
        event: ${event}
        data:
          ${field}: ${value}
    - lvgl.label.update:
        id: ${remote}_toast
        text: "${toast}"
  widgets:
    - label:
        align: CENTER
        text: "${text}"
        text_font: montserrat_16
        text_color: 0xF2F5F8
