# Home Assistant's brightness (0-255) for one dimmer, kept as a percentage in
# the global ${key}_pct for its full-screen page. A sensor entry, included with
# vars: key, entity. An off light has no brightness attribute, so this only
# updates while the light is on; the page shows 0 for an off light itself.
platform: homeassistant
id: ${key}_brightness
entity_id: ${entity}
attribute: brightness
internal: true
on_value:
  - if:
      condition:
        lambda: return !std::isnan(x);
      then:
        - globals.set:
            id: ${key}_pct
            value: !lambda return (int) roundf(x * 100.0f / 255.0f);
        - if:
            condition:
              lambda: 'return id(detail_entity) == "${entity}";'
            then:
              - script.execute:
                  id: detail_refresh
                  is_on: !lambda return id(${key}_on).state;
                  level: !lambda return id(${key}_pct);
