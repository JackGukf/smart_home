# One view on a remote page - Wall panel, or TV cast (design: .card.view-card).
# Tapping it asks that screen to show that dashboard view. Included with vars:
#   remote  wall or tv: names its ids (${remote}_view, ${remote}_refresh,
#           ${remote}_toast, ${remote}_<key>_view_card)
#   event   esphome.wall_panel_show_view or esphome.tv_cast_show_view
#   screen  what the toast calls that screen
#   key     the dashboard's view name (home, cameras, alarm, devices, climate, status)
#   title   what the card says
#   icon    an LVGL symbol
#   x, y
#
# The request is a Home Assistant event, which the dashboard forwards only to
# that screen's own browser. An event goes out over
# the API connection the panel already has, so unlike an HTTP request it never
# holds up the panel's main loop.
obj:
  id: ${remote}_${key}_view_card
  x: ${x}
  y: ${y}
  width: 209
  height: 62
  radius: 14
  pad_all: 0
  border_width: 0
  bg_color: 0x3E444E
  bg_opa: 74%
  scrollable: false
  checked:
    bg_color: 0x647696
    bg_opa: 90%
  on_click:
    - homeassistant.event:
        event: ${event}
        data:
          view: ${key}
    - globals.set:
        id: ${remote}_view
        value: '"${key}"'
    - script.execute: ${remote}_refresh
    - lvgl.label.update:
        id: ${remote}_toast
        text: "${screen}: ${title}"
  # One line: the view's icon and name, and "Showing" on the one the wall panel is on.
  # Shorter than it was (96px) so the page has room for scrolling and the
  # Home camera below the six views.
  widgets:
    - label:
        x: 14
        y: 18
        text: "${icon}"
        text_font: montserrat_22
        text_color: 0xF2F5F8
    - label:
        x: 46
        y: 20
        text: "${title}"
        text_font: montserrat_16
        text_color: 0xF2F5F8
    - label:
        id: ${remote}_${key}_view_sub
        x: 110
        y: 22
        width: 86
        text_align: RIGHT
        text: "Show"
        text_font: montserrat_14
        text_color: 0xD1D6DC
