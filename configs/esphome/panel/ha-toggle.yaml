# Home Assistant's on/off for one light, drawn onto its card and onto the
# full-screen page when that light is open. A binary_sensor entry, included
# with vars: key, entity, room, level (as for panel/card-toggle.yaml).
platform: homeassistant
id: ${key}_on
entity_id: ${entity}
internal: true
# Without this, on_state does not fire for the state received when the panel
# connects - ESPHome's default since trigger_on_initial_state replaced
# publish_initial_state - so a light already on at boot showed as off until it
# next changed. The lights that happened to be off looked right.
trigger_on_initial_state: true
on_state:
  # For a few seconds after a tap the card keeps what was tapped and
  # ${key}_settle draws the real state when it ends: an update in flight
  # otherwise flipped the switch back and forth (panel/light-settle.yaml).
  - if:
      condition:
        not:
          script.is_running: ${key}_settle
      then:
        - script.execute:
            id: ${key}_show
            is_on: !lambda return x;
  # The launcher's "N on" badge counts Home Assistant's states, not taps.
  - script.execute: launcher_refresh
  - if:
      condition:
        lambda: 'return id(detail_entity) == "${entity}";'
      then:
        - script.execute:
            id: detail_refresh
            is_on: !lambda return x;
            level: !lambda return ${level};
