# One dimmer as a wide Home card (design: .card.wide.dim, 431 x 106 at 480 px).
# Included from voice-panel.yaml with vars: key, entity, name, room, y.
# Its state comes from panel/ha-dimmer-on.yaml and panel/ha-dimmer-level.yaml.
obj:
  id: ${key}_card
  x: 0
  y: ${y}
  width: 431
  height: 106
  radius: 16
  pad_all: 0
  border_width: 0
  bg_color: 0x3E444E
  bg_opa: 74%
  scrollable: false
  widgets:
    - image:
        id: ${key}_bulb
        src: bulb_off
        x: 10
        y: 8
        clickable: true
        on_click:
          - script.execute:
              id: open_light
              entity: "${entity}"
              name: "${name}"
              room: "${room}"
              dimmer: true
              is_on: !lambda return id(${key}_on).state;
              level: !lambda |-
                float b = id(${key}_brightness).state;
                return std::isnan(b) ? 0 : (int) roundf(b * 100.0f / 255.0f);
    # long_mode dot only truncates with a fixed height; with the default
    # content height the name wrapped onto the state line below it.
    - label:
        text: "${name}"
        x: 14
        y: 52
        width: 160
        height: 18
        long_mode: dot
        text_font: montserrat_14
        text_color: 0xF2F5F8
    - label:
        id: ${key}_sub
        text: "Off • dimmer"
        x: 14
        y: 76
        text_font: montserrat_14
        text_color: 0xD1D6DC
    - slider:
        id: ${key}_slider
        x: 180
        y: 23
        width: 170
        height: 60
        min_value: 0
        max_value: 100
        value: 0
        radius: 14
        bg_color: 0x14161A
        bg_opa: 45%
        indicator:
          radius: 14
          bg_color: 0x7A6448
          bg_grad_color: 0xE7C488
          bg_grad_dir: HOR
        knob:
          bg_color: 0xAAC4E6
          bg_opa: 35%
          border_color: 0xD7E8FF
          border_width: 3
        # The percentage follows the finger; Home Assistant hears only the
        # release, so a drag is one command rather than dozens.
        on_value:
          - lvgl.label.update:
              id: ${key}_pct
              text: !lambda return to_string((int) x) + "%";
        on_release:
          - if:
              condition:
                lambda: return x < 1;
              then:
                - homeassistant.action:
                    action: light.turn_off
                    data:
                      entity_id: ${entity}
              else:
                - homeassistant.action:
                    action: light.turn_on
                    data:
                      entity_id: ${entity}
                      brightness_pct: !lambda return to_string((int) x);
    - label:
        id: ${key}_pct
        text: "0%"
        x: 358
        y: 42
        width: 62
        text_align: RIGHT
        text_font: montserrat_20
        text_color: 0xF2F5F8
