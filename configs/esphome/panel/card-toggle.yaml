# One on/off light as a Home card (design: .card.light, 209 x 130 at 480 px).
# Included from voice-panel.yaml with vars: key, entity, name, room, x, y.
# Its state comes from panel/ha-toggle.yaml with the same key.
obj:
  id: ${key}_card
  x: ${x}
  y: ${y}
  width: 209
  height: 130
  radius: 16
  pad_all: 0
  border_width: 0
  bg_color: 0x3E444E
  bg_opa: 74%
  scrollable: false
  checked:
    bg_color: 0x647696
    bg_opa: 90%
  widgets:
    # The lamp opens the light full screen; the switch toggles it in place.
    - image:
        id: ${key}_lamp
        src: lamp_off
        x: 10
        y: 8
        clickable: true
        on_click:
          - script.execute:
              id: open_light
              entity: "${entity}"
              name: "${name}"
              room: "${room}"
              dimmer: false
              is_on: !lambda return id(${key}_on).state;
              level: 0
    - switch:
        id: ${key}_switch
        x: 137
        y: 14
        width: 58
        height: 30
        bg_color: 0xFFFFFF
        bg_opa: 28%
        indicator:
          bg_opa: 0%
          checked:
            bg_color: 0xF3B23A
            bg_opa: 100%
        knob:
          bg_color: 0xFFFFFF
        # Explicit on/off rather than toggle: a tap that crosses an update from
        # Home Assistant still ends in the state the switch shows.
        on_change:
          - if:
              condition:
                lambda: return x;
              then:
                - homeassistant.action:
                    action: light.turn_on
                    data:
                      entity_id: ${entity}
              else:
                - homeassistant.action:
                    action: light.turn_off
                    data:
                      entity_id: ${entity}
    # Two lines at most, then dots: a fixed height keeps a long name off the
    # state line below it.
    - label:
        text: "${name}"
        x: 14
        y: 70
        width: 185
        height: 34
        long_mode: dot
        text_font: montserrat_14
        text_color: 0xF2F5F8
    - label:
        id: ${key}_sub
        text: "Off • ${room}"
        x: 14
        y: 106
        text_font: montserrat_14
        text_color: 0xD1D6DC
