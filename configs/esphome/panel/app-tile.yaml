# One app on the launcher (docs/design/voice-panel-screens.html, revision 2).
# Included with vars:
#   key     names the tile and its badge: ${key}_tile, ${key}_badge
#   title   the name under the icon
#   icon    an image id (app_* from scripts/render-panel-icons.py)
#   page    the open_app number
#   x, y
# The badge is hidden until a script gives it something to say (lights on, the
# thermostat target, security alerts).
obj:
  id: ${key}_tile
  x: ${x}
  y: ${y}
  width: 128
  height: 128
  radius: 0
  pad_all: 0
  border_width: 0
  bg_opa: 0%
  scrollable: false
  on_click:
    - script.execute:
        id: open_app
        page: ${page}
  widgets:
    - image:
        src: ${icon}
        align: TOP_MID
        y: 8
    - label:
        align: TOP_MID
        y: 106
        text: "${title}"
        text_font: montserrat_16
        text_color: 0xF2F5F8
    - label:
        id: ${key}_badge
        x: 88
        y: 0
        text: ""
        text_font: montserrat_14
        text_color: 0x241A12
        bg_color: 0xF2F5F8
        bg_opa: 100%
        radius: 11
        pad_left: 7
        pad_right: 7
        pad_top: 2
        pad_bottom: 2
        hidden: true
