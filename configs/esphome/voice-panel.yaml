# Waveshare ESP32-S3-Touch-LCD-4B as a Home Assistant voice satellite.
#
# Voice only, display deliberately absent. The board drives a 480x480 RGB panel,
# which has no frame memory of its own: the S3 shifts 450KB out of PSRAM
# continuously, roughly 27MB/s, and the wake word inference wants the same
# PSRAM. ESPHome's own reference voice devices all use SPI or QSPI displays that
# hold their own frame memory, avoiding that by construction. So voice is proven
# first and the screen is added afterwards - that way a wake word that degrades
# when the display arrives has exactly one suspect.
#
# Pin map is from Waveshare's own demos (ESP32-S3-Touch-LCD-4B-Demos.zip),
# not guessed:
#   Mylibrary/pin_config.h      I2S pins below
#   examples/*/*.ino            Wire.begin(47, 48) and the expander at 0x20
#
# The two codecs share one I2S bus - one MCLK, BCLK and LRCK between them, with
# separate data lines - which is what the demo's
# i2s.setPins(BCLK, LRCK, ES8311_DOUT, ES7210_DIN, MCLK) says.

substitutions:
  name: voice-panel
  friendly_name: Voice Panel
  # This firmware's own version, shown in Settings > About. Bump it with each
  # voice-panel-vX.Y.Z tag.
  firmware_version: "0.2.0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.7.0
  project:
    name: smart-home.voice-panel
    version: "${firmware_version}"
  # The Settings app's Wi-Fi scan (panel/wifi_scan.h).
  includes:
    - panel/wifi_scan.h
  on_boot:
    # Flash 6: the display power-up exactly as Waveshare's demo does it, in
    # its order and with its delays. Priority 700 runs after the expander (900)
    # and before the display (600), and a lambda's delay() blocks, so the
    # display's setup cannot start until this is done. mipi_rgb's own reset is
    # a 5 ms pulse and it only raises pin 7; the demo holds reset low 200 ms.
    #   Arduino_XCA9554SWSPI::begin(): pin 7 LOW 10 ms, HIGH 100 ms;
    #     CS (0), SCK (2), MOSI (1) outputs, HIGH. The clock must already idle
    #     high: expander outputs start low, and in MODE3 the first transfer
    #     would otherwise raise it with CS low - a spurious bit that corrupts
    #     the first command (the software reset).
    #   sketch setup(): pin 6 LOW, 200 ms; pin 5 LOW, 200 ms; HIGH, 200 ms.
    - priority: 700
      then:
        - lambda: |-
            auto *x = id(io_expander);
            auto out = [x](uint8_t pin, bool level) {
              x->digital_write(pin, level);
              x->pin_mode(pin, gpio::FLAG_OUTPUT);
            };
            out(7, false);
            delay(10);
            out(7, true);
            delay(100);
            out(0, true);
            out(2, true);
            out(1, true);
            out(6, false);
            delay(200);
            out(5, false);
            delay(200);
            out(5, true);
            delay(200);
    - priority: 600
      then:
        # The demos set expander pin 3 high before touching either codec. It is
        # the audio enable: without it the ES8311 plays into nothing and the
        # ES7210 hears nothing, with no error from either.
        - switch.turn_on: audio_enable
    - priority: -100
      then:
        # micro_wake_word does not listen until something tells it to, and the
        # only other start here is in voice_assistant's on_end - which can never
        # run, because no session can end that never began. Without this the
        # device sits idle for ever: Home Assistant lists the wake word, the
        # microphone is configured, and nothing is listening to it.
        - delay: 3s
        - micro_wake_word.start:

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    # The RGB panel has no frame memory: the S3 must clock every frame out on
    # time. After an OTA reboot the screen flickered until the first LVGL redraw
    # (tapping the button), which re-synchronised it - the signal lost sync
    # while boot was busy with flash and PSRAM. Espressif's fixes for RGB drift:
    #   RESTART_IN_VSYNC  re-align the stream at every vertical sync
    #   ISR_IRAM_SAFE     keep refreshing while the flash cache is off (NVS, OTA)
    #   XIP_FROM_PSRAM    run code from PSRAM so flash access cannot stall it;
    #                     costs about 1.7 MB of the PSRAM the wake word shares
    sdkconfig_options:
      # Off, deliberately. The RGB driver feeds the panel from two bounce
      # buffers in turn and picks which to refill from bb_eof_count % 2. With
      # this on, every VSYNC restarts the stream from buffer 0 but never resets
      # that count (esp_lcd_panel_rgb.c, lcd_rgb_panel_try_restart_transmission).
      # One refill interrupt lost in a busy moment - a voice session - leaves the
      # count odd, and every refill after it lands in the buffer being sent: the
      # screen shakes once, then flickers until another lost interrupt flips it
      # back. Off, the VSYNC handler zeroes the count on each restart, and
      # mipi_rgb asks for a restart every loop.
      CONFIG_LCD_RGB_RESTART_IN_VSYNC: n
      CONFIG_LCD_RGB_ISR_IRAM_SAFE: y
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      # Plain allocations over 16 KB come from PSRAM first, smaller ones from
      # internal RAM first, each falling back to the other rather than failing
      # (heap_caps_malloc_default). ESPHome's default (caps alloc) kept every
      # malloc internal, so the camera's JPEG decoder - an ~18 KB JPEGDEC object
      # per frame - took it from the internal heap the wake word and Wi-Fi live
      # on (low point 35 KB). The IDF's 32 KB internal reserve stays: plain
      # mallocs reach it only last, and it keeps task stacks and DMA buffers
      # (Wi-Fi, I2S) served when internal RAM runs low.
      CONFIG_SPIRAM_USE_CAPS_ALLOC: n
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "16384"

# ESP32-S3-WROOM-1-N16R8: 8MB octal PSRAM. micro_wake_word needs it, and octal
# at 80MHz is the configuration its inference is sized against.
psram:
  mode: octal
  speed: 80MHz

# DEBUG, the default, is enough to see the wake word. micro_wake_word has no
# VERBOSE lines at all - it never prints a probability per inference - so what
# answers "is it listening" is "State changed from X to DETECTING_WAKE_WORD",
# and the Microphone capturing sensor below. VERBOSE was tried and only added
# noise: its silence was read as the engine not running when it was.
logger:
  level: DEBUG
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password

# No credentials in the repo and none in the image. improv_serial lets the
# browser that flashes the device hand it the network over the same USB cable,
# so the password goes straight from you to the device. If it ever cannot join,
# it raises its own access point and captive_portal asks again.
wifi:
  # ESPHome's default on an ESP32 is "light": the radio sleeps between beacons.
  # Measured 2026-09-15 from the board: 108-287 ms average and up to 1.2 s to the
  # panel, while the router answered in 0.7 ms. Every camera frame request holds
  # the main loop until its reply, so those spikes froze the panel - flicker, and
  # voice commands reaching Home Assistant as "Time is it." The panel is mains
  # powered; the radio stays awake.
  power_save_mode: none
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:
improv_serial:

i2c:
  sda: GPIO47
  scl: GPIO48
  scan: true
  id: bus_a

# TCA9554 IO expander. Pins 0, 1, 2 and 7 bit-bang SPI to the ST7701 display;
# pin 3 is the audio enable and the only one this config touches.
pca9554:
  - id: io_expander
    address: 0x20

# The ST7701 is configured over a bit-banged 3-wire SPI that runs through the
# TCA9554, not over MCU pins: Waveshare's demo builds it as
# Arduino_XCA9554SWSPI(rst=7, cs=0, sck=2, mosi=1, &Wire, 0x20). ESPHome's SPI
# accepts expander pins in software mode, and mipi_rgb sends 9-bit words (the
# D/C bit in front) when there is no DC pin, which is what 3-wire ST7701 needs.
# Slow, but it only carries the one-time init sequence; pixels go over RGB.
spi:
  - id: lcd_spi
    interface: software
    clk_pin:
      pca9554: io_expander
      number: 2
    mosi_pin:
      pca9554: io_expander
      number: 1

# A warm restart from Home Assistant. The screen flickered after an OTA reboot
# (a software reset: the panel and the expander stay powered) and was steady
# after a USB power cycle, so this reproduces the case without re-flashing.
button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

switch:
  - platform: gpio
    id: audio_enable
    name: "Audio enable"
    entity_category: config
    restore_mode: ALWAYS_ON
    pin:
      pca9554: io_expander
      number: 3
      mode:
        output: true

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO16
    i2s_mclk_pin: GPIO5

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_a
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 24dB

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO15
    adc_type: external
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    address: 0x18
    bits_per_sample: 16bit
    # Playback runs at 48k while the microphone stays at 16k. The two codecs
    # share one I2S bus on this board, but they are not used at the same time,
    # so each stream configures the clock when it starts. 16k everywhere was
    # the wake word's requirement leaking into playback and making speech
    # sound thin.
    sample_rate: 48000
    use_mclk: true

# Three speakers for one physical output, which ESPHome requires rather than
# suggests: the announcement and media pipelines cannot share a speaker, and
# saying so is a hard config error. A mixer owns the real I2S output and hands
# each pipeline its own source to write into.
speaker:
  - platform: i2s_audio
    id: i2s_out
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO6
    dac_type: external
    audio_dac: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 48000
    channel: mono

  - platform: mixer
    id: mixer_out
    output_speaker: i2s_out
    source_speakers:
      - id: announcement_spk
      - id: media_spk

# Announcements and any other audio Home Assistant sends come through a media
# player rather than straight at the speaker. Without one the satellite reports
# no announce support at all, and assist_satellite.announce fails with
# ServiceNotSupported - which is exactly what it did before this was here.
media_player:
  - platform: speaker
    id: media_out
    name: "Media"
    # The usable part of the dial, found by listening at each end rather than
    # assumed. Clean at 0.8 (a normal speaking level) and at 0.9; harsh at 1.0,
    # so the top tenth is where this 2W amp and its small speaker stop being
    # linear and it is simply kept out of reach.
    #
    # Worth knowing which fault this was: distortion that appears only when loud
    # is amplitude, not bandwidth. A sample rate that is too low sounds thin at
    # *every* volume, so raising it further would not have touched this.
    volume_min: 0.5
    volume_max: 0.9
    # Two pipelines, and both are needed. announcement_pipeline carries
    # assist_satellite.announce and the assistant's replies; media_pipeline
    # carries media_player.play_media. Defining only the first left play_media
    # with no speaker to drain into, so it sat in "playing" for ever and made
    # nothing come out - which reads as dead hardware rather than as a missing
    # four lines of config.
    announcement_pipeline:
      speaker: announcement_spk
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_spk
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    # The microphone and the speaker are the same I2S bus on this board - one
    # MCLK, BCLK and LRCK between the ES7210 and the ES8311 - so they cannot run
    # at once. With the wake word listening continuously the speaker could not
    # start at all: "Parent bus is busy", retrying once a second until the mic
    # happened to let go. That is why every announcement hung for seconds and
    # the satellite sat in "responding".
    #
    # So the microphone steps aside for playback and comes back afterwards.
    #
    # Coming back is the hard half, and it was the "wake word never runs" fault.
    # After an announcement the media player goes idle ~90 ms before
    # voice_assistant does, so an instant "if not voice_assistant.is_running"
    # here refused the restart and nothing retried: the wake word stayed stopped
    # until a reboot, after every announcement and every spoken reply. So the
    # restart waits for the bus to actually be free - see restart_wake_word.
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - micro_wake_word.stop:
    on_idle:
      - lvgl.widget.hide: voice_pill
      - lambda: lv_display_trigger_activity(lv_display_get_default());
      - script.execute: restart_wake_word

micro_wake_word:
  id: wake_word
  microphone:
    microphone: mic
  models:
    - model: okay_nabu
  on_wake_word_detected:
    # A sleeping screen wakes for the voice too; on_resume lifts the cover.
    - if:
        condition:
          lvgl.is_paused:
        then:
          - lvgl.resume:
    - logger.log:
        format: "wake word detected: %s"
        args: [wake_word.c_str()]
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: assist
  microphone:
    microphone: mic
  media_player: media_out
  # This link is what puts the on-device wake words in Home Assistant's list.
  # Without it the satellite advertises only "no_wake_word", which reads as the
  # wake word being broken when it is really just not being offered.
  micro_wake_word: wake_word
  noise_suppression_level: 2
  auto_gain: 31dBFS
  # Was 2.0, copied from ESPHome's reference device, which drives a different
  # amplifier. Doubling the TTS before it reaches a codec that is already near
  # full scale is the other half of the clipping.
  volume_multiplier: 1.0
  # A session can end without playing anything (an error, an empty reply), in
  # which case the media player never goes idle and would never restart the
  # wake word. Not on_idle: in this ESPHome that fires only in continuous mode,
  # so for an on-device wake word it never runs at all.
  on_listening:
    - lvgl.label.update:
        id: voice_pill_text
        text: "Listening..."
    - lvgl.widget.show: voice_pill
  on_stt_vad_end:
    - lvgl.label.update:
        id: voice_pill_text
        text: "Thinking..."
  on_tts_start:
    - lvgl.label.update:
        id: voice_pill_text
        text: "Answering..."
  # The pill stays up while the answer plays and goes when the media player
  # does (media_player on_idle); a session with nothing to play clears it here.
  # Either way the session counts as activity, so the idle timer restarts.
  on_end:
    - if:
        condition:
          media_player.is_idle: media_out
        then:
          - lvgl.widget.hide: voice_pill
          - lambda: lv_display_trigger_activity(lv_display_get_default());
    - script.execute: restart_wake_word
  on_error:
    - lvgl.widget.hide: voice_pill
    - lambda: lv_display_trigger_activity(lv_display_get_default());
    - script.execute: restart_wake_word

# The one place the wake word comes back after the microphone stepped aside.
# Every exit path calls it, and it waits rather than checks, because each
# "done" signal arrives before the bus is actually free:
#   - voice_assistant is still running ~90 ms after the media player goes idle
#   - the I2S speaker holds the bus for its 500 ms timeout after the last write
# mode: restart, so several callers collapse into one wait instead of queueing.
script:
  - id: restart_wake_word
    mode: restart
    then:
      - wait_until:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - media_player.is_idle: media_out
              - speaker.is_stopped: i2s_out
      - micro_wake_word.start:

  - id: update_clock
    then:
      - lvgl.label.update:
          id: clock_label
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            return t.strftime("%H:%M");
      - lvgl.label.update:
          id: launcher_time
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            return t.strftime("%H:%M");
      - lvgl.label.update:
          id: launcher_date
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("");
            std::string text = t.strftime("%A ") + to_string(t.day_of_month) + t.strftime(" %B");
            return text;

  - id: thermo_refresh
    then:
      - lvgl.label.update:
          id: thermo_temp
          text: !lambda |-
            float t = id(thermo_target).state;
            if (std::isnan(t)) return std::string("--");
            char buf[16];
            snprintf(buf, sizeof(buf), fmod(t, 1.0f) == 0 ? "%.0f°C" : "%.1f°C", t);
            return std::string(buf);
      - lvgl.label.update:
          id: thermo_mode
          text: !lambda |-
            const std::string &a = id(thermo_action).state;
            std::string mode = a == "heating" ? "HEATING" : a == "cooling" ? "COOLING"
                             : a == "idle" ? "IDLE" : a == "off" ? "OFF" : a.empty() ? "--" : a;
            return mode;
      - lvgl.label.update:
          id: thermo_room_value
          text: !lambda |-
            float r = id(thermo_room).state;
            if (std::isnan(r)) return std::string("--");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f°C", r);
            return std::string(buf);
      - lvgl.label.update:
          id: thermo_hum_value
          text: !lambda |-
            float h = id(thermo_humidity).state;
            if (std::isnan(h)) return std::string("--");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f%%", h);
            return std::string(buf);
      - lvgl.label.update:
          id: launcher_inside
          text: !lambda |-
            float r = id(thermo_room).state;
            if (std::isnan(r)) return std::string("");
            char buf[24];
            snprintf(buf, sizeof(buf), "Inside %.1f°C", r);
            return std::string(buf);
      - if:
          condition:
            lambda: return !std::isnan(id(thermo_target).state);
          then:
            - lvgl.label.update:
                id: climate_badge
                text: !lambda |-
                  char buf[12];
                  snprintf(buf, sizeof(buf), "%.0f°", id(thermo_target).state);
                  return std::string(buf);
            - lvgl.widget.show: climate_badge
          else:
            - lvgl.widget.hide: climate_badge

  # One tap is one degree, clamped to the design's 10-26 °C. The card moves at
  # once; Home Assistant's own update confirms or corrects it.
  - id: thermo_step
    parameters:
      delta: float
    then:
      - if:
          condition:
            lambda: return !std::isnan(id(thermo_target).state);
          then:
            - lambda: |-
                float t = std::max(10.0f, std::min(26.0f, id(thermo_target).state + delta));
                id(thermo_target).publish_state(t);
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: climate.my_ecobee
                  temperature: !lambda return to_string(id(thermo_target).state);

  - id: open_light
    parameters:
      entity: string
      name: string
      room: string
      dimmer: bool
      is_on: bool
      level: int
    then:
      - globals.set:
          id: detail_entity
          value: !lambda return entity;
      - globals.set:
          id: detail_room
          value: !lambda return room;
      - globals.set:
          id: detail_dimmer
          value: !lambda return dimmer;
      - lvgl.label.update:
          id: detail_name
          text: !lambda return name;
      - if:
          condition:
            lambda: return dimmer;
          then:
            - lvgl.widget.show: detail_dim_box
            - lvgl.widget.update:
                id: detail_lamp
                x: -70
            - lvgl.widget.update:
                id: detail_level
                x: -70
          else:
            - lvgl.widget.hide: detail_dim_box
            - lvgl.widget.update:
                id: detail_lamp
                x: 0
            - lvgl.widget.update:
                id: detail_level
                x: 0
      - script.execute:
          id: detail_refresh
          is_on: !lambda return is_on;
          level: !lambda return level;
      - lvgl.widget.hide: header_bar
      - lvgl.page.show: light_page

  - id: close_light
    then:
      - globals.set:
          id: detail_entity
          value: '""'
      - script.execute:
          id: open_app
          page: 1

  - id: detail_refresh
    parameters:
      is_on: bool
      level: int
    then:
      - lvgl.label.update:
          id: detail_state
          text: !lambda 'return is_on ? std::string("ON") : std::string("OFF");'
      - lvgl.label.update:
          id: detail_level
          text: !lambda |-
            if (!id(detail_dimmer)) return id(detail_room);
            if (!is_on) return std::string("Off");
            return "Brightness " + to_string(level) + "%";
      - if:
          condition:
            lambda: return id(detail_dimmer);
          then:
            - lvgl.slider.update:
                id: detail_slider
                value: !lambda 'return is_on ? level : 0;'
      - if:
          condition:
            lambda: return is_on;
          then:
            - lvgl.image.update:
                id: detail_lamp
                src: dome_on
          else:
            - lvgl.image.update:
                id: detail_lamp
                src: dome_off

  # The open dimmer to a brightness in %; 0 turns it off.
  - id: set_brightness
    parameters:
      pct: int
    then:
      - if:
          condition:
            lambda: return pct < 1;
          then:
            - homeassistant.action:
                action: light.turn_off
                data:
                  entity_id: !lambda return id(detail_entity);
          else:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda return id(detail_entity);
                  brightness_pct: !lambda return to_string(pct);

  # The launcher and its apps: 0 launcher, 1 Lights, 2 Climate, 3 Scenes,
  # 4 Security, 5 Cameras, 6 Wall panel, 7 Settings; from Settings 8 Wi-Fi, 9 Volume, 10 Sleep, 11 Schedule,
  # 12 About; and 13 TV cast, from the launcher like Wall panel. Each app's own open and leave work is
  # here: leaving Cameras frees the snapshot, opening Wall panel re-highlights.
  - id: open_app
    parameters:
      page: int
    then:
      - globals.set:
          id: current_app
          value: !lambda return page;
      # Leaving the Cameras app frees the snapshot's memory, which the wake word
      # shares.
      - if:
          condition:
            lambda: return page != 5;
          then:
            - lvgl.widget.hide: cam_view
            - lvgl.label.update:
                id: cam_status
                text: "Loading..."
            - online_image.release: cam_image
            # Release cuts off a download in flight without calling
            # on_download_finished or on_error, so nothing else would clear
            # this: the next visit's camera_fetch saw "busy" and never asked.
            - globals.set:
                id: cam_busy
                value: "false"
      - lvgl.label.update:
          id: page_title
          text: !lambda |-
            static const char *const titles[] = {"", "lights", "climate", "scenes",
                                                 "security", "cameras", "wall panel", "settings", "wi-fi",
                                                 "volume", "sleep", "schedule", "about", "tv cast"};
            std::string title = page >= 0 && page <= 13 ? titles[page] : "";
            return title;
      - if:
          condition:
            lambda: return page == 0;
          then:
            - lvgl.widget.hide: header_bar
            - script.execute: launcher_refresh
            - lvgl.page.show: launcher_page
          else:
            - lvgl.widget.show: header_bar
      - if:
          condition:
            lambda: return page == 1;
          then:
            - lvgl.page.show: lights_page
      - if:
          condition:
            lambda: return page == 2;
          then:
            - lvgl.page.show: climate_page
      - if:
          condition:
            lambda: return page == 3;
          then:
            - lvgl.page.show: scenes_page
      - if:
          condition:
            lambda: return page == 4;
          then:
            - lvgl.page.show: security_page
      - if:
          condition:
            lambda: return page == 5;
          then:
            - lvgl.page.show: cameras_page
            - script.execute: camera_open
      - if:
          condition:
            lambda: return page == 6;
          then:
            - script.execute: wall_refresh
            - lvgl.page.show: wall_page
      - if:
          condition:
            lambda: return page == 7;
          then:
            - script.execute: settings_refresh
            - lvgl.page.show: settings_page
      - if:
          condition:
            lambda: return page == 8;
          then:
            - script.execute: wifi_keyboard_close
            - script.execute: wifi_refresh
            - lvgl.page.show: wifi_page
      - if:
          condition:
            lambda: return page == 9;
          then:
            - script.execute: settings_refresh
            - lvgl.page.show: volume_page
      - if:
          condition:
            lambda: return page == 10;
          then:
            - script.execute: settings_refresh
            - lvgl.page.show: sleep_page
      - if:
          condition:
            lambda: return page == 11;
          then:
            - script.execute: settings_refresh
            - lvgl.page.show: schedule_page
      - if:
          condition:
            lambda: return page == 12;
          then:
            - script.execute: settings_refresh
            - lvgl.page.show: about_page
      - if:
          condition:
            lambda: return page == 13;
          then:
            - script.execute: tv_refresh
            - lvgl.page.show: cast_page

  # The Settings page drawn from what is in force: the speaker's volume (which
  # Home Assistant can also change) and the sleep choice.
  - id: settings_refresh
    then:
      - lvgl.slider.update:
          id: volume_slider
          value: !lambda return (int) roundf(id(media_out).volume * 100);
      - lvgl.label.update:
          id: volume_value
          text: !lambda |-
            std::string text = to_string((int) roundf(id(media_out).volume * 100)) + "%";
            return text;
      - lvgl.widget.update:
          id: sleep_30
          state:
            checked: !lambda return id(sleep_secs) == 30;
      - lvgl.widget.update:
          id: sleep_60
          state:
            checked: !lambda return id(sleep_secs) == 60;
      - lvgl.widget.update:
          id: sleep_120
          state:
            checked: !lambda return id(sleep_secs) == 120;
      - lvgl.widget.update:
          id: sleep_300
          state:
            checked: !lambda return id(sleep_secs) == 300;
      - lvgl.widget.update:
          id: sleep_600
          state:
            checked: !lambda return id(sleep_secs) == 600;
      - lvgl.widget.update:
          id: sleep_never
          state:
            checked: !lambda return id(sleep_secs) == 0;
      - lvgl.label.update:
          id: settings_wifi_name
          text: !lambda |-
            std::string text = id(wifi_ssid).state.empty() ? "Not connected" : id(wifi_ssid).state;
            return text;
      - lvgl.label.update:
          id: settings_about_esphome
          text: !lambda |-
            std::string text = ESPHOME_VERSION;
            return text;
      # In the panel's own time zone, to the minute; the build machine stamps its own.
      - lvgl.label.update:
          id: settings_about_build
          text: !lambda |-
            std::string text = ESPTime::from_epoch_local(App.get_build_time()).strftime("%Y-%m-%d %H:%M");
            return text;
      - lvgl.widget.update:
          id: schedule_switch
          state:
            checked: !lambda return id(schedule_enabled);
      - lvgl.roller.update:
          id: sched_off_hour
          animated: false
          selected_index: !lambda return id(schedule_off_min) / 60;
      - lvgl.roller.update:
          id: sched_off_minute
          animated: false
          selected_index: !lambda return (id(schedule_off_min) % 60) / 5;
      - lvgl.roller.update:
          id: sched_on_hour
          animated: false
          selected_index: !lambda return id(schedule_on_min) / 60;
      - lvgl.roller.update:
          id: sched_on_minute
          animated: false
          selected_index: !lambda return (id(schedule_on_min) % 60) / 5;
      - script.execute: schedule_status_refresh

  # Settings > Schedule's status line, and "On" on its tile.
  - id: schedule_status_refresh
    then:
      - lvgl.label.update:
          id: schedule_status
          text: !lambda |-
            if (!id(schedule_enabled)) {
              std::string text = "Off - the Sleep setting applies all day";
              return text;
            }
            char buf[48];
            snprintf(buf, sizeof(buf), "Dark from %02d:%02d to %02d:%02d", id(schedule_off_min) / 60,
                     id(schedule_off_min) % 60, id(schedule_on_min) / 60, id(schedule_on_min) % 60);
            std::string text = buf;
            return text;
      - if:
          condition:
            lambda: return id(schedule_enabled);
          then:
            - lvgl.label.update:
                id: set_schedule_badge
                text: "On"
            - lvgl.widget.show: set_schedule_badge
          else:
            - lvgl.widget.hide: set_schedule_badge

  # A change on the Schedule page: read the four rollers, keep it, apply it now.
  - id: schedule_store
    then:
      - lambda: |-
          id(schedule_off_min) = lv_roller_get_selected(id(sched_off_hour)->obj) * 60 +
                                 lv_roller_get_selected(id(sched_off_minute)->obj) * 5;
          id(schedule_on_min) = lv_roller_get_selected(id(sched_on_hour)->obj) * 60 +
                                lv_roller_get_selected(id(sched_on_minute)->obj) * 5;
      - script.execute: schedule_status_refresh
      - script.execute: settings_save
      - script.execute: schedule_check

  # Night mode: from schedule_off_min to schedule_on_min (the night may cross
  # midnight) the screen sleeps. Acts only when night starts or ends, so a
  # touch at night still wakes the screen (for 30 s - see on_idle).
  - id: schedule_check
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          bool night = false;
          if (id(schedule_enabled) && now.is_valid()) {
            int m = now.hour * 60 + now.minute;
            int off = id(schedule_off_min), on = id(schedule_on_min);
            if (off < on)
              night = m >= off && m < on;
            else if (off > on)
              night = m >= off || m < on;
          }
          id(screen_night_changed) = night != id(screen_night);
          id(screen_night) = night;
      - if:
          condition:
            lambda: return id(screen_night_changed) && id(screen_night);
          then:
            - if:
                condition:
                  not:
                    voice_assistant.is_running:
                then:
                  - script.execute: panel_sleep
      - if:
          condition:
            lambda: return id(screen_night_changed) && !id(screen_night);
          then:
            - if:
                condition:
                  lvgl.is_paused:
                then:
                  - lvgl.resume:
            # A fresh idle count, or the screen would sleep again at once.
            - lambda: lv_display_trigger_activity(lv_display_get_default());

  # Settings are kept in flash (NVS): the volume by the media player, the sleep
  # choice by its restore_value global, Wi-Fi by wifi.configure (which writes at
  # once). The first two only mark the value for saving, and ESPHome writes those
  # every 60 s, so a restart soon after a change lost it; this writes now. The
  # delay lets both record the new value first - each does so in its own loop.
  - id: settings_save
    mode: restart
    then:
      - delay: 1s
      - lambda: global_preferences->sync();

  # The Wi-Fi page's status line: where the panel is now. Worded as a state, not
  # an action - "Connected to" on opening the page read as the panel joining.
  - id: wifi_refresh
    then:
      - lvgl.label.update:
          id: wifi_status
          text: !lambda |-
            std::string text = id(wifi_ssid).state.empty() ? "Not connected" : "Now on " + id(wifi_ssid).state;
            return text;

  # Look for networks: a scan while connected, read back once it has had time
  # to finish (a few seconds across all channels).
  - id: wifi_scan
    mode: single
    then:
      - if:
          condition:
            lambda: return panel_wifi_scan_start();
          then:
            - lvgl.label.update:
                id: wifi_status
                text: "Scanning..."
            - delay: 5s
            - lambda: |-
                std::string options = panel_wifi_scan_options(12);
                id(wifi_scanned) = !options.empty();
                // ->obj: the roller's LVGL object. id(wifi_list) is ESPHome's
                // wrapper around it; cast as an lv_obj_t, the options were
                // written over the wrapper and the memory beside it.
                lv_roller_set_options(id(wifi_list)->obj,
                                      id(wifi_scanned) ? options.c_str() : "No networks found",
                                      LV_ROLLER_MODE_NORMAL);
            - lvgl.label.update:
                id: wifi_status
                text: "Pick a network, then tap Password"
          else:
            - lvgl.label.update:
                id: wifi_status
                text: "Could not scan now - try again"

  # Typing a password: the list steps aside and the password row moves up above
  # the keyboard, which is only shown while typing.
  - id: wifi_keyboard_open
    then:
      - lambda: |-
          char name[64];
          lv_roller_get_selected_str(id(wifi_list)->obj, name, sizeof(name));
          id(wifi_target) = name;
      - lvgl.widget.hide: wifi_list
      - lvgl.widget.hide: wifi_scan_button
      - lvgl.widget.hide: wifi_hint
      - lvgl.widget.update:
          id: wifi_password
          y: 112
      - lvgl.widget.update:
          id: wifi_connect_button
          y: 112
      - lvgl.widget.show: wifi_keyboard
      - if:
          condition:
            lambda: return id(wifi_scanned);
          then:
            - lvgl.label.update:
                id: wifi_status
                text: !lambda |-
                  std::string text = "Password for " + id(wifi_target);
                  return text;
  - id: wifi_keyboard_close
    then:
      - lvgl.widget.hide: wifi_keyboard
      - lvgl.widget.update:
          id: wifi_password
          y: 300
      - lvgl.widget.update:
          id: wifi_connect_button
          y: 300
      - lvgl.widget.show: wifi_list
      - lvgl.widget.show: wifi_scan_button
      - lvgl.widget.show: wifi_hint

  # Join the network picked in the list with the password typed. From the
  # Connect button or the keyboard's tick.
  - id: wifi_connect
    then:
      - script.execute: wifi_keyboard_close
      - if:
          condition:
            lambda: return !id(wifi_scanned);
          then:
            - lvgl.label.update:
                id: wifi_status
                text: "Tap Scan, then pick a network"
          else:
            - lambda: |-
                char name[64];
                lv_roller_get_selected_str(id(wifi_list)->obj, name, sizeof(name));
                id(wifi_target) = name;
            - lvgl.label.update:
                id: wifi_status
                text: !lambda |-
                  std::string text = "Joining " + id(wifi_target) + "...";
                  return text;
            - wifi.configure:
                ssid: !lambda return id(wifi_target);
                password: !lambda return std::string(lv_textarea_get_text(id(wifi_password)));
                save: true
                timeout: 30s
                on_connect:
                  - lvgl.textarea.update:
                      id: wifi_password
                      text: ""
                  - script.execute: wifi_refresh
                on_error:
                  - lvgl.label.update:
                      id: wifi_status
                      text: !lambda |-
                        std::string text = "Could not join " + id(wifi_target);
                        return text;

  # The launcher's weather: Home Assistant's condition drawn as one of nine
  # pictures, and the temperature. met.no reports sunny, clear-night,
  # partlycloudy, cloudy, rainy, pouring, snowy, snowy-rainy, hail, lightning,
  # lightning-rainy, fog, windy, windy-variant and exceptional.
  - id: weather_refresh
    then:
      - if:
          condition:
            lambda: 'return id(weather_condition).state.empty() || id(weather_condition).state == "unavailable" || id(weather_condition).state == "unknown";'
          then:
            - lvgl.widget.hide: launcher_weather_icon
            - lvgl.label.update:
                id: launcher_weather_temp
                text: ""
          else:
            - lvgl.image.update:
                id: launcher_weather_icon
                src: !lambda |-
                  const std::string &c = id(weather_condition).state;
                  if (c == "sunny") return id(weather_sunny);
                  if (c == "clear-night") return id(weather_night);
                  if (c == "partlycloudy") return id(weather_partlycloudy);
                  if (c == "rainy" || c == "pouring") return id(weather_rainy);
                  if (c == "snowy" || c == "snowy-rainy" || c == "hail") return id(weather_snowy);
                  if (c == "lightning" || c == "lightning-rainy") return id(weather_lightning);
                  if (c == "fog") return id(weather_fog);
                  if (c == "windy" || c == "windy-variant") return id(weather_windy);
                  return id(weather_cloudy);
            - lvgl.widget.show: launcher_weather_icon
            - lvgl.label.update:
                id: launcher_weather_temp
                text: !lambda |-
                  std::string text = std::isnan(id(weather_temp).state) ? "" : to_string((int) lroundf(id(weather_temp).state)) + "°";
                  return text;

  # The launcher's page dots: the page of apps showing is the solid one.
  - id: launcher_dots
    parameters:
      first: bool
    then:
      - lambda: |-
          lv_obj_set_style_bg_opa(id(launcher_dot_1), first ? LV_OPA_COVER : LV_OPA_40, 0);
          lv_obj_set_style_bg_opa(id(launcher_dot_2), first ? LV_OPA_40 : LV_OPA_COVER, 0);

  # The launcher's Lights badge: how many of the six are on, from Home Assistant.
  - id: launcher_refresh
    then:
      - if:
          condition:
            lambda: |-
              return id(master_on).state || id(living2_on).state || id(kitchen_on).state ||
                     id(family_on).state || id(north_on).state || id(stick_on).state;
          then:
            - lvgl.label.update:
                id: lights_badge
                text: !lambda |-
                  int n = id(master_on).state + id(living2_on).state + id(kitchen_on).state +
                          id(family_on).state + id(north_on).state + id(stick_on).state;
                  std::string text = to_string(n) + " on";
                  return text;
            - lvgl.widget.show: lights_badge
          else:
            - lvgl.widget.hide: lights_badge

  # Sleep: back to the launcher first (which also releases a camera), so a wake
  # lands there; then the black cover, and LVGL paused once it has drawn it.
  - id: panel_sleep
    then:
      - script.execute:
          id: open_app
          page: 0
      # And to the first page of apps.
      - lvgl.tileview.select:
          id: launcher_apps
          tile_id: apps_page_1
          animated: false
      - script.execute:
          id: launcher_dots
          first: true
      - lvgl.widget.hide: voice_pill
      - lvgl.widget.show: sleep_cover
      - delay: 300ms
      - lvgl.pause:

  # One snapshot, unless one is still downloading - a slow frame must not queue
  # a second request behind it.
  - id: camera_fetch
    then:
      - if:
          condition:
            lambda: return !id(cam_busy);
          then:
            - globals.set:
                id: cam_busy
                value: "true"
            - component.update: cam_image

  # Highlight the view last sent to the wall panel.
  - id: wall_refresh
    then:
      - lvgl.widget.update:
          id: wall_home_view_card
          state:
            checked: !lambda 'return id(wall_view) == "home";'
      - lvgl.label.update:
          id: wall_home_view_sub
          text: !lambda |-
            std::string text = id(wall_view) == "home" ? "Showing" : "Show";
            return text;
      - lvgl.widget.update:
          id: wall_cameras_view_card
          state:
            checked: !lambda 'return id(wall_view) == "cameras";'
      - lvgl.label.update:
          id: wall_cameras_view_sub
          text: !lambda |-
            std::string text = id(wall_view) == "cameras" ? "Showing" : "Show";
            return text;
      - lvgl.widget.update:
          id: wall_alarm_view_card
          state:
            checked: !lambda 'return id(wall_view) == "alarm";'
      - lvgl.label.update:
          id: wall_alarm_view_sub
          text: !lambda |-
            std::string text = id(wall_view) == "alarm" ? "Showing" : "Show";
            return text;
      - lvgl.widget.update:
          id: wall_devices_view_card
          state:
            checked: !lambda 'return id(wall_view) == "devices";'
      - lvgl.label.update:
          id: wall_devices_view_sub
          text: !lambda |-
            std::string text = id(wall_view) == "devices" ? "Showing" : "Show";
            return text;
      - lvgl.widget.update:
          id: wall_climate_view_card
          state:
            checked: !lambda 'return id(wall_view) == "climate";'
      - lvgl.label.update:
          id: wall_climate_view_sub
          text: !lambda |-
            std::string text = id(wall_view) == "climate" ? "Showing" : "Show";
            return text;
      - lvgl.widget.update:
          id: wall_status_view_card
          state:
            checked: !lambda 'return id(wall_view) == "status";'
      - lvgl.label.update:
          id: wall_status_view_sub
          text: !lambda |-
            std::string text = id(wall_view) == "status" ? "Showing" : "Show";
            return text;

  # The TV cast page's views, as the Wall panel page's above.
  - id: tv_refresh
    then:
      - lvgl.widget.update:
          id: tv_home_view_card
          state:
            checked: !lambda 'return id(tv_view) == "home";'
      - lvgl.label.update:
          id: tv_home_view_sub
          text: !lambda |-
            std::string text = id(tv_view) == "home" ? "Showing" : "Show";
            return text;
      - lvgl.widget.update:
          id: tv_cameras_view_card
          state:
            checked: !lambda 'return id(tv_view) == "cameras";'
      - lvgl.label.update:
          id: tv_cameras_view_sub
          text: !lambda |-
            std::string text = id(tv_view) == "cameras" ? "Showing" : "Show";
            return text;
      - lvgl.widget.update:
          id: tv_alarm_view_card
          state:
            checked: !lambda 'return id(tv_view) == "alarm";'
      - lvgl.label.update:
          id: tv_alarm_view_sub
          text: !lambda |-
            std::string text = id(tv_view) == "alarm" ? "Showing" : "Show";
            return text;
      - lvgl.widget.update:
          id: tv_devices_view_card
          state:
            checked: !lambda 'return id(tv_view) == "devices";'
      - lvgl.label.update:
          id: tv_devices_view_sub
          text: !lambda |-
            std::string text = id(tv_view) == "devices" ? "Showing" : "Show";
            return text;
      - lvgl.widget.update:
          id: tv_climate_view_card
          state:
            checked: !lambda 'return id(tv_view) == "climate";'
      - lvgl.label.update:
          id: tv_climate_view_sub
          text: !lambda |-
            std::string text = id(tv_view) == "climate" ? "Showing" : "Show";
            return text;
      - lvgl.widget.update:
          id: tv_status_view_card
          state:
            checked: !lambda 'return id(tv_view) == "status";'
      - lvgl.label.update:
          id: tv_status_view_sub
          text: !lambda |-
            std::string text = id(tv_view) == "status" ? "Showing" : "Show";
            return text;
  - id: camera_select
    parameters:
      stream: string
    then:
      - lvgl.widget.hide: cam_view
      - online_image.release: cam_image
      - globals.set:
          id: cam_busy
          value: "false"
      - globals.set:
          id: cam_stream
          value: !lambda return stream;
      - script.execute: camera_open

  # Opening the Cameras page: show the relay's last view first - it answers at
  # once, while the live frames take 2-3 s to start - then go live.
  - id: camera_open
    then:
      - lvgl.widget.update:
          id: cam_pick_front
          state:
            checked: !lambda return id(cam_stream) == "front_door_camera";
      - lvgl.widget.update:
          id: cam_pick_garage
          state:
            checked: !lambda return id(cam_stream) == "garage_camera";
      - lvgl.label.update:
          id: cam_name
          text: !lambda |-
            std::string text = id(cam_stream) == "garage_camera" ? "Garage camera" : "Front door camera";
            return text;
      - lvgl.label.update:
          id: cam_time
          text: ""
      - globals.set:
          id: cam_busy
          value: "false"
      - globals.set:
          id: cam_phase
          value: "0"
      - globals.set:
          id: cam_opened_ms
          value: !lambda return millis();
      - lvgl.label.update:
          id: cam_status
          text: "Loading..."
      - online_image.set_url:
          id: cam_image
          url: !lambda 'return "http://192.168.0.83:1985/camera/" + id(cam_stream) + "/last.jpg";'
          update: false
      - script.execute: camera_fetch

  # The Security page's top card: red when any sensor needs attention or the
  # alarm is triggered, with the alarm's own state underneath.
  - id: security_refresh
    then:
      - if:
          condition:
            lambda: |-
              return id(frontyard_sec).state || id(door_sec).state || id(window_sec).state ||
                     id(smoke_sec).state || id(doorcam_sec).state || id(garage_sec).state ||
                     id(alarm_state).state == "triggered";
          then:
            - lvgl.label.update:
                id: sec_title
                text: "ATTENTION"
            - lvgl.image.update:
                id: sec_shield
                src: shield_alert
            - lvgl.widget.update:
                id: sec_pill
                bg_color: 0xE07A64
                bg_opa: 30%
            - lvgl.label.update:
                id: sec_pill_text
                text: "ALERT"
                text_color: 0xFFB3A2
          else:
            - lvgl.label.update:
                id: sec_title
                text: "ALL CLEAR"
            - lvgl.image.update:
                id: sec_shield
                src: shield_ok
            - lvgl.widget.update:
                id: sec_pill
                bg_color: 0x6FD3A7
                bg_opa: 22%
            - lvgl.label.update:
                id: sec_pill_text
                text: "CLEAR"
                text_color: 0x9EE6C5
      - lvgl.label.update:
          id: sec_sub
          text: !lambda |-
            const std::string &a = id(alarm_state).state;
            std::string words = a == "disarmed" ? "disarmed" : a == "armed_home" ? "armed home"
                              : a == "armed_away" ? "armed away" : a == "armed_night" ? "armed night"
                              : a == "triggered" ? "TRIGGERED" : a == "arming" ? "arming"
                              : a == "pending" ? "pending" : a.empty() ? "--" : a;
            std::string text = "Alarm " + words + " • 6 sensors";
            return text;
      # The launcher's Security badge: the number needing attention, in red.
      - if:
          condition:
            lambda: |-
              return id(frontyard_sec).state || id(door_sec).state || id(window_sec).state ||
                     id(smoke_sec).state || id(doorcam_sec).state || id(garage_sec).state ||
                     id(alarm_state).state == "triggered";
          then:
            - lvgl.label.update:
                id: security_badge
                text: !lambda |-
                  int n = id(frontyard_sec).state + id(door_sec).state + id(window_sec).state +
                          id(smoke_sec).state + id(doorcam_sec).state + id(garage_sec).state;
                  std::string text = to_string(n > 0 ? n : 1);
                  return text;
            - lvgl.widget.update:
                id: security_badge
                bg_color: 0xE5533C
                text_color: 0xFFFFFF
            - lvgl.widget.show: security_badge
          else:
            - lvgl.widget.hide: security_badge

  # Per light: draw its card, and hold a tap for a few seconds before showing
  # Home Assistant's state again (panel/light-show.yaml, panel/light-settle.yaml).
  - !include
    file: panel/light-show.yaml
    vars: {key: master, room: Bedroom}
  - !include
    file: panel/light-settle.yaml
    vars: {key: master}
  - !include
    file: panel/light-show.yaml
    vars: {key: living2, room: Living Room}
  - !include
    file: panel/light-settle.yaml
    vars: {key: living2}
  - !include
    file: panel/light-show.yaml
    vars: {key: kitchen, room: Kitchen}
  - !include
    file: panel/light-settle.yaml
    vars: {key: kitchen}
  - !include
    file: panel/light-show.yaml
    vars: {key: family, room: Family room}
  - !include
    file: panel/light-settle.yaml
    vars: {key: family}
  - !include
    file: panel/light-show.yaml
    vars: {key: north, room: Bedroom}
  - !include
    file: panel/light-settle.yaml
    vars: {key: north}
  - !include
    file: panel/light-show.yaml
    vars: {key: stick, room: Office}
  - !include
    file: panel/light-settle.yaml
    vars: {key: stick}

binary_sensor:
  - platform: status
    name: "Status"

  # Cast to TV, on or off (switch.tv_cast), for the TV cast page's switch.
  - platform: homeassistant
    id: tv_cast_on
    entity_id: switch.tv_cast
    internal: true
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: cast_switch
          state:
            checked: !lambda return x;

  # Is the microphone actually capturing? Everything so far has been inferred
  # from silence, which cannot distinguish "not listening" from "listening and
  # hearing nothing".
  - platform: template
    name: "Microphone capturing"
    entity_category: diagnostic
    lambda: return id(mic)->is_running();

  # A display or touch setup error is logged once at boot, before Wi-Fi and the
  # API are up, so a log client never sees it. These carry the failed flag to
  # Home Assistant instead.
  - platform: template
    name: "Display failed"
    entity_category: diagnostic
    lambda: return id(panel)->is_failed();
  - platform: template
    name: "Touch failed"
    entity_category: diagnostic
    lambda: return id(touch)->is_failed();

  # The six lights on Home, from Home Assistant. The TP-Link originals, not the
  # Dashboard Bridge twins - except Stick S3, which only exists through it.
  - !include
    file: panel/ha-toggle.yaml
    vars: {key: master, entity: light.bedroom_master_bedroom_light, room: Bedroom, level: "0"}
  - !include
    file: panel/ha-toggle.yaml
    vars: {key: living2, entity: light.living_room_living_room_switch_2, room: Living Room, level: "0"}
  - !include
    file: panel/ha-toggle.yaml
    vars: {key: kitchen, entity: light.kitchen_light_switch, room: Kitchen, level: "id(kitchen_pct)"}
  - !include
    file: panel/ha-toggle.yaml
    vars: {key: family, entity: light.family_room_switch, room: Family room, level: "id(family_pct)"}
  - !include
    file: panel/ha-toggle.yaml
    vars: {key: north, entity: light.bedroom_north_bedroom_light_switch, room: Bedroom, level: "0"}
  - !include
    file: panel/ha-toggle.yaml
    vars: {key: stick, entity: light.stick_s3, room: Office, level: "0"}

  # The Security page's sensors (panel/ha-security.yaml).
  - !include
    file: panel/ha-security.yaml
    vars: {key: frontyard, entity: binary_sensor.frontyard_camera_npu_person, off_text: "No one", on_expr: 'id(ha_time).now().is_valid() ? "Person • " + id(ha_time).now().strftime("%H:%M") : std::string("Person")'}
  - !include
    file: panel/ha-security.yaml
    vars: {key: door, entity: binary_sensor.0xa4c138813abdffff_contact, off_text: "Closed", on_expr: 'std::string("Open")'}
  - !include
    file: panel/ha-security.yaml
    vars: {key: window, entity: binary_sensor.0xffffdc2350fe16ab_contact, off_text: "Closed", on_expr: 'std::string("Open")'}
  - !include
    file: panel/ha-security.yaml
    vars: {key: smoke, entity: binary_sensor.fire_alarm_detector_smoke, off_text: "No smoke", on_expr: 'std::string("SMOKE")'}
  - !include
    file: panel/ha-security.yaml
    vars: {key: doorcam, entity: binary_sensor.front_door_camera_npu_person, off_text: "No one", on_expr: 'id(ha_time).now().is_valid() ? "Person • " + id(ha_time).now().strftime("%H:%M") : std::string("Person")'}
  - !include
    file: panel/ha-security.yaml
    vars: {key: garage, entity: binary_sensor.garage_camera_npu_person, off_text: "No one", on_expr: 'id(ha_time).now().is_valid() ? "Person • " + id(ha_time).now().strftime("%H:%M") : std::string("Person")'}

# ── Display, phase 1: bring-up only ───────────────────────────────────────────
#
# Voice was proven first on purpose (docs/voice-assistant-proposal.md): this RGB
# panel has no frame memory, so the S3 streams 480x480 out of the same PSRAM the
# wake word uses. Phase 1 is one static test page, so any change in wake-word
# behaviour has exactly one suspect. The GUI in the design proposal comes after
# the wake word has been re-measured with this running.
#
# Every pin and timing value is from Waveshare's ESP32-S3-Touch-LCD-4B demo
# (01_HelloWorld.ino). ESPHome's built-in WAVESHARE-4-480X480 model is a
# different board: its data pins include GPIO5 and GPIO47/48, which are the I2S
# clock and the I2C bus here.
display:
  - platform: mipi_rgb
    id: panel
    model: CUSTOM
    spi_id: lcd_spi
    # Fourth flash. Arduino_GFX's XCA9554SWSPI idles the clock HIGH (mode 3);
    # the CUSTOM model defaults to MODE0. ESPHome's own Waveshare ST7701 model
    # uses MODE3 at 2MHz. Over an I2C expander the rate is nominal anyway.
    spi_mode: MODE3
    data_rate: 2MHz
    cs_pin:
      pca9554: io_expander
      number: 0
    # Reset (expander 5) and enables (6 low, 7 high) are driven by the on_boot
    # lambda with the demo's timing, not by reset_pin/enable_pins - see there.
    # Flashes 1-5 used those options; the history is in
    # docs/handoff-2026-09-14-panel-display.md.
    dimensions:
      width: 480
      height: 480
    de_pin: 17
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 9
    # The demo leaves the clock at Arduino_GFX's default; 12 MHz is what ESPHome
    # uses for Waveshare's other 480x480 ST7701 panel, ~42 Hz here, and less
    # PSRAM traffic than 16 MHz while the wake word shares that memory.
    # The demo leaves the clock at Arduino_GFX's default; 12 MHz is what ESPHome
    # uses for Waveshare's other 480x480 ST7701 panel, ~42 Hz here, and less
    # PSRAM traffic than 16 MHz while the wake word shares that memory. (10 MHz
    # was tried against the voice-time dots on 2026-09-15 and made no difference.)
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_front_porch: 10
    hsync_pulse_width: 8
    hsync_back_porch: 50
    vsync_front_porch: 10
    vsync_pulse_width: 8
    vsync_back_porch: 20
    # Red and blue are exchanged against the demo's pin names (R 40-1, B 10-14).
    # With those names, text drawn red showed blue and blue showed red, while
    # green was right (flash 7). color_order cannot fix it here: for a CUSTOM
    # model mipi_rgb stores it but never sends it, and appends MADCTL 0x00 after
    # init_sequence, so a BGR bit in the table is overwritten.
    data_pins:
      red: [10, 11, 12, 13, 14]
      green: [21, 8, 18, {number: 45, ignore_strapping_warning: true}, 38, 39]
      blue: [40, 41, 42, 2, 1]
    # IPS panel: the demo sends INVON. ESPHome appends INVON/INVOFF, pixel
    # format, MADCTL, SLPOUT and DISPON itself, so those are not repeated below.
    invert_colors: true
    pixel_mode: 18bit
    auto_clear_enabled: false
    update_interval: never
    # Waveshare's st7701_type1_init_operations, register setup only. The demo
    # waits 120 ms after reset before the first command; ESPHome's driver
    # releases reset and writes immediately, which an ST7701 can ignore.
    # Arduino_RGB_Display::begin() has no reset pin, so it sends a software
    # reset (0x01) and waits 120 ms before the table; mipi_rgb never sends one.
    init_sequence:
      - delay 120ms
      - [0x01]
      - delay 120ms
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xC0, 0x3B, 0x00]
      - [0xC1, 0x0D, 0x02]
      - [0xC2, 0x31, 0x05]
      - [0xCD, 0x08]
      - [0xB0, 0x00, 0x11, 0x18, 0x0E, 0x11, 0x06, 0x07, 0x08, 0x07, 0x22, 0x04, 0x12, 0x0F, 0xAA, 0x31, 0x18]
      - [0xB1, 0x00, 0x11, 0x19, 0x0E, 0x12, 0x07, 0x08, 0x08, 0x08, 0x22, 0x04, 0x11, 0x11, 0xA9, 0x32, 0x18]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x60]
      - [0xB1, 0x32]
      - [0xB2, 0x07]
      - [0xB3, 0x80]
      - [0xB5, 0x49]
      - [0xB7, 0x85]
      - [0xB8, 0x21]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xE0, 0x00, 0x1B, 0x02]
      - [0xE1, 0x08, 0xA0, 0x00, 0x00, 0x07, 0xA0, 0x00, 0x00, 0x00, 0x44, 0x44]
      - [0xE2, 0x11, 0x11, 0x44, 0x44, 0xED, 0xA0, 0x00, 0x00, 0xEC, 0xA0, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x11]
      - [0xE4, 0x44, 0x44]
      - [0xE5, 0x0A, 0xE9, 0xD8, 0xA0, 0x0C, 0xEB, 0xD8, 0xA0, 0x0E, 0xED, 0xD8, 0xA0, 0x10, 0xEF, 0xD8, 0xA0]
      - [0xE6, 0x00, 0x00, 0x11, 0x11]
      - [0xE7, 0x44, 0x44]
      - [0xE8, 0x09, 0xE8, 0xD8, 0xA0, 0x0B, 0xEA, 0xD8, 0xA0, 0x0D, 0xEC, 0xD8, 0xA0, 0x0F, 0xEE, 0xD8, 0xA0]
      - [0xEB, 0x02, 0x00, 0xE4, 0xE4, 0x88, 0x00, 0x40]
      - [0xEC, 0x3C, 0x00]
      - [0xED, 0xAB, 0x89, 0x76, 0x54, 0x02, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x20, 0x45, 0x67, 0x98, 0xBA]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]
      - [0xE5, 0xE4]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]

# GT911 on the shared I2C bus, with no reset or interrupt line: Waveshare's
# demos call GT911.setPins(-1, -1). The driver tries 0x5D then 0x14 (the I2C
# scan found it at 0x14) and polls.
touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bus_a
    display: panel

# The GUI, from docs/design/voice-panel-screens.html: Home (the six lights from
# the dashboard's Lights card and the ecobee), Scenes, and a full-screen page
# per light. Every card follows Home Assistant, so voice, dashboard and panel
# agree. Geometry is the design's, at 480 px: 24 px gutters, 209 px cards.
# The room photo is not in yet - a warm gradient stands in for it.
lvgl:
  id: ui
  displays: [panel]
  touchscreens: [touch]
  buffer_size: 25%

  # Sleep and wake. The backlight cannot be switched off yet - no documentation
  # for this board names its control pin, and expander pin 2, which the 4-inch
  # non-B board uses for it, is the display controller's SPI clock here. So sleep
  # is a black cover and LVGL paused: nothing redraws, the screen shows black.
  # A touch resumes LVGL (resume_on_input, on by default; the wake tap is not
  # passed to the page) and on_resume lifts the cover. "Okay Nabu" wakes it too.
  # How long is the Settings app's choice (sleep_secs, 0 for never), read on
  # every check, so a change applies at once. At night (Settings > Schedule) a
  # touch wakes the screen for 30 s, whatever that choice.
  on_idle:
    - timeout: !lambda 'return id(screen_night) ? 30000u : (id(sleep_secs) > 0 ? id(sleep_secs) * 1000u : 0xFFFFFFFFu);'
      then:
        - if:
            condition:
              not:
                voice_assistant.is_running:
            then:
              - script.execute: panel_sleep
  on_resume:
    - lvgl.widget.hide: sleep_cover
    - script.execute: update_clock

  # The app header is on the top layer, so every app shares one. It is hidden on
  # the launcher, which has its own glance, and on the full-screen light page.
  top_layer:
    widgets:
      - obj:
          id: header_bar
          x: 0
          y: 0
          width: 480
          height: 64
          radius: 0
          pad_all: 0
          border_width: 0
          bg_opa: 0%
          scrollable: false
          clickable: false
          hidden: true
          widgets:
            - button:
                x: 16
                y: 10
                width: 46
                height: 46
                radius: 23
                bg_color: 0xFFFFFF
                bg_opa: 10%
                shadow_width: 0
                border_width: 0
                # Back: Settings' own apps return to Settings, every other app
                # to the launcher.
                on_click:
                  - script.execute:
                      id: open_app
                      page: !lambda 'return id(current_app) >= 8 && id(current_app) != 13 ? 7 : 0;'
                widgets:
                  - label:
                      align: CENTER
                      text: "\uF053"
                      text_font: montserrat_20
                      text_color: 0xF2F5F8
            - label:
                id: page_title
                x: 74
                y: 19
                text: "lights"
                text_font: montserrat_22
                text_color: 0xF2F5F8
            # Green while the wake word is listening, grey while it is not.
            - obj:
                id: listen_dot
                x: 296
                y: 27
                width: 9
                height: 9
                radius: 5
                border_width: 0
                pad_all: 0
                bg_color: 0x6B7280
                scrollable: false
            - label:
                x: 311
                y: 22
                text: "Okay Nabu"
                text_font: montserrat_14
                text_color: 0xCCD1D6
            - label:
                id: clock_label
                align: TOP_RIGHT
                x: -24
                y: 21
                text: "--:--"
                text_font: montserrat_16
                text_color: 0xCCD1D6
      # What the voice assistant is doing, over whatever screen is up.
      - obj:
          id: voice_pill
          align: BOTTOM_MID
          y: -24
          width: 250
          height: 56
          radius: 28
          pad_all: 0
          border_width: 0
          bg_color: 0x1E6CE8
          bg_opa: 94%
          shadow_color: 0x3C8CFF
          shadow_width: 24
          shadow_opa: 50%
          scrollable: false
          clickable: false
          hidden: true
          widgets:
            - label:
                id: voice_pill_text
                align: CENTER
                text: "Listening..."
                text_font: montserrat_20
                text_color: 0xFFFFFF
      # Sleep: black over everything (see on_idle).
      - obj:
          id: sleep_cover
          x: 0
          y: 0
          width: 480
          height: 480
          radius: 0
          pad_all: 0
          border_width: 0
          bg_color: 0x000000
          bg_opa: 100%
          scrollable: false
          hidden: true

  pages:
    # The launcher: the first page, so the panel starts here, and where every app
    # returns. A glance - time, day, listening, inside temperature - over six
    # app tiles whose badges say what needs saying without opening the app.
    - id: launcher_page
      bg_color: 0x3A2618
      bg_grad_color: 0x1C120B
      bg_grad_dir: VER
      scrollable: false
      pad_all: 0
      widgets:
        - label:
            id: launcher_time
            x: 26
            y: 18
            text: "--:--"
            text_font: clock_font
            text_color: 0xF2F5F8
        - label:
            id: launcher_date
            x: 32
            y: 124
            text: ""
            text_font: montserrat_20
            text_color: 0xD9DEE3
        - obj:
            id: launcher_listen_dot
            x: 34
            y: 168
            width: 9
            height: 9
            radius: 5
            border_width: 0
            pad_all: 0
            bg_color: 0x6B7280
            scrollable: false
        - label:
            x: 50
            y: 161
            text: "Okay Nabu"
            text_font: montserrat_16
            text_color: 0xC2C8CF
        - label:
            id: launcher_inside
            x: 176
            y: 161
            text: ""
            text_font: montserrat_16
            text_color: 0xC2C8CF
        # The weather now, top right, beside the clock (weather_refresh). Hidden
        # until Home Assistant has sent a condition.
        - image:
            id: launcher_weather_icon
            src: weather_cloudy
            x: 390
            y: 18
            hidden: true
        - label:
            id: launcher_weather_temp
            x: 334
            y: 88
            width: 120
            text: ""
            text_align: RIGHT
            text_font: montserrat_20
            text_color: 0xF2F5F8
        # The apps, six to a page; swipe left for the next. A new app takes the
        # next free place (x 24/176/328, y 6/136); a full page needs another tile
        # here, a dot below and a line in launcher_dots.
        - tileview:
            id: launcher_apps
            x: 0
            y: 190
            width: 480
            height: 272
            radius: 0
            pad_all: 0
            border_width: 0
            bg_opa: 0%
            scrollbar_mode: "OFF"
            on_value:
              - script.execute:
                  id: launcher_dots
                  first: !lambda return tile == id(apps_page_1);
            tiles:
              - id: apps_page_1
                row: 0
                column: 0
                dir: RIGHT
                bg_opa: 0%
                pad_all: 0
                widgets:
                  - !include {file: panel/app-tile.yaml, vars: {key: lights, title: "Lights", icon: app_lights, page: 1, x: 24, y: 6}}
                  - !include {file: panel/app-tile.yaml, vars: {key: climate, title: "Climate", icon: app_climate, page: 2, x: 176, y: 6}}
                  - !include {file: panel/app-tile.yaml, vars: {key: scenes, title: "Scenes", icon: app_scenes, page: 3, x: 328, y: 6}}
                  - !include {file: panel/app-tile.yaml, vars: {key: security, title: "Security", icon: app_security, page: 4, x: 24, y: 136}}
                  - !include {file: panel/app-tile.yaml, vars: {key: cameras, title: "Cameras", icon: app_cameras, page: 5, x: 176, y: 136}}
                  - !include {file: panel/app-tile.yaml, vars: {key: wall, title: "Wall panel", icon: app_panel, page: 6, x: 328, y: 136}}
              - id: apps_page_2
                row: 0
                column: 1
                dir: LEFT
                bg_opa: 0%
                pad_all: 0
                widgets:
                  - !include {file: panel/app-tile.yaml, vars: {key: settings, title: "Settings", icon: app_settings, page: 7, x: 24, y: 6}}
                  - !include {file: panel/app-tile.yaml, vars: {key: tvcast, title: "TV cast", icon: app_cast, page: 13, x: 176, y: 6}}
        # Which page of apps is showing.
        - obj:
            id: launcher_dot_1
            x: 223
            y: 466
            width: 8
            height: 8
            radius: 4
            pad_all: 0
            border_width: 0
            bg_color: 0xF2F5F8
            bg_opa: 100%
            clickable: false
            scrollable: false
        - obj:
            id: launcher_dot_2
            x: 249
            y: 466
            width: 8
            height: 8
            radius: 4
            pad_all: 0
            border_width: 0
            bg_color: 0xF2F5F8
            bg_opa: 40%
            clickable: false
            scrollable: false

    # Lights: the six cards; a lamp opens the light full screen.
    - id: lights_page
      bg_color: 0x3A2618
      bg_grad_color: 0x1C120B
      bg_grad_dir: VER
      scrollable: false
      pad_all: 0
      widgets:
        # Swipe right goes back to the launcher. On a wrapper, not the page (pages take no swipe triggers) and not the scrolling list (a swipe trigger turns scrolling off).
        - obj:
            id: lights_swipe
            # LVGL delivers a gesture to the first widget up the chain WITHOUT
            # gesture_bubble - which every child has by default - so without this
            # the swipe went past the wrapper to the page and nothing happened.
            gesture_bubble: false
            x: 0
            y: 0
            width: 480
            height: 480
            radius: 0
            pad_all: 0
            border_width: 0
            bg_opa: 0%
            clickable: true
            on_swipe_right:
              - script.execute:
                  id: open_app
                  page: 0
            widgets:
            # Everything under the bar scrolls; the bar stays.
            - obj:
                id: lights_scroll
                x: 0
                y: 64
                width: 480
                height: 416
                radius: 0
                border_width: 0
                bg_opa: 0%
                pad_top: 0
                pad_bottom: 24
                pad_left: 24
                pad_right: 24
                scrollbar_mode: "OFF"
                scroll_dir: VER
                widgets:
                  - !include
                    file: panel/card-toggle.yaml
                    vars: {key: master, entity: light.bedroom_master_bedroom_light, name: "MASTER BEDROOM LIGHT", room: Bedroom, x: 0, y: 0, dimmer: "false", level: "0"}
                  - !include
                    file: panel/card-toggle.yaml
                    vars: {key: living2, entity: light.living_room_living_room_switch_2, name: "LIVING ROOM SWITCH 2", room: Living Room, x: 222, y: 0, dimmer: "false", level: "0"}
                  - !include
                    file: panel/card-toggle.yaml
                    vars: {key: kitchen, entity: light.kitchen_light_switch, name: "KITCHEN LIGHT SWITCH", room: Kitchen, x: 0, y: 143, dimmer: "true", level: "id(kitchen_pct)"}
                  - !include
                    file: panel/card-toggle.yaml
                    vars: {key: family, entity: light.family_room_switch, name: "FAMILY ROOM SWITCH", room: Family room, x: 222, y: 143, dimmer: "true", level: "id(family_pct)"}
                  - label:
                      x: 4
                      y: 286
                      text: "BEDROOM • OFFICE"
                      text_font: montserrat_14
                      text_color: 0xA8ADB3
                  - !include
                    file: panel/card-toggle.yaml
                    vars: {key: north, entity: light.bedroom_north_bedroom_light_switch, name: "NORTH BEDROOM LIGHT SWITCH", room: Bedroom, x: 0, y: 312, dimmer: "false", level: "0"}
                  - !include
                    file: panel/card-toggle.yaml
                    vars: {key: stick, entity: light.stick_s3, name: "STICK S3", room: Office, x: 222, y: 312, dimmer: "false", level: "0"}

    # Climate: the ecobee on its own screen. The target moves at once on a tap and
    # Home Assistant's update confirms or corrects it (thermo_step).
    - id: climate_page
      bg_color: 0x3A2618
      bg_grad_color: 0x1C120B
      bg_grad_dir: VER
      scrollable: false
      pad_all: 0
      widgets:
        # Swipe right goes back to the launcher. On a wrapper, not the page (pages take no swipe triggers) and not the scrolling list (a swipe trigger turns scrolling off).
        - obj:
            id: climate_swipe
            # LVGL delivers a gesture to the first widget up the chain WITHOUT
            # gesture_bubble - which every child has by default - so without this
            # the swipe went past the wrapper to the page and nothing happened.
            gesture_bubble: false
