# The launcher clock: Montserrat ExtraBold at 96 px, digits and colon only, so
# it costs little flash. Everything else uses LVGL's built-in Montserrat.
font:
  - file: "gfonts://Montserrat@800"
    id: clock_font
    size: 96
    glyphs: "0123456789:-"

# The header clock, from Home Assistant's time.
time:
  - platform: homeassistant
    id: ha_time
    # Home Assistant's own zone, compiled in. Without it the panel shows UTC -
    # 7 hours ahead here - from boot until Home Assistant connects and sends the
    # zone: the chip keeps its clock across a restart, but not its time zone.
    timezone: America/Vancouver
    # Also night mode (Settings > Schedule): checked each minute, and once the
    # time is known after a restart.
    on_time_sync:
      - script.execute: update_clock
      - script.execute: schedule_check
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock
          - script.execute: schedule_check

interval:
  - interval: 2s
    then:
      - if:
          condition:
            micro_wake_word.is_running:
          then:
            - lvgl.widget.update:
                id: listen_dot
                bg_color: 0x6FD3A7
            - lvgl.widget.update:
                id: launcher_listen_dot
                bg_color: 0x6FD3A7
          else:
            - lvgl.widget.update:
                id: listen_dot
                bg_color: 0x6B7280
            - lvgl.widget.update:
                id: launcher_listen_dot
                bg_color: 0x6B7280
  # The next frame as soon as the last one is in (camera_fetch skips while one
  # is downloading), but never during a voice session: the audio goes out
  # through the same main loop a download holds.
  - interval: 300ms
    then:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: cameras_page
              - not:
                  voice_assistant.is_running:
          then:
            - script.execute: camera_fetch

# Which light the full-screen page is showing.
globals:
  - id: detail_entity
    type: std::string
    initial_value: '""'
  - id: detail_room
    type: std::string
    initial_value: '""'
  - id: detail_dimmer
    type: bool
    initial_value: "false"
  # The dimmers' last brightness in %, from panel/ha-dimmer-level.yaml.
  - id: kitchen_pct
    type: int
    initial_value: "0"
  - id: family_pct
    type: int
    initial_value: "0"
  # The view last sent to the hallway wall panel (panel/card-view.yaml). The
  # wall panel boots into Home, so that is where this starts.
  - id: wall_view
    type: std::string
    initial_value: '"home"'
  # The view last sent to the TV (the cast starts on Home, too).
  - id: tv_view
    type: std::string
    initial_value: '"home"'
  # The camera the Cameras page shows: a stream name the board's relay serves.
  - id: cam_stream
    type: std::string
    initial_value: '"front_door_camera"'
  # A snapshot download is in flight (camera_fetch).
  - id: cam_busy
    type: bool
    initial_value: "false"
  # 0: fetching the relay's last view on opening the page; 1: live frames.
  - id: cam_phase
    type: int
    initial_value: "0"
  # millis() when the page opened, and of the last picture received. "Camera not
  # answering" waits 8 s from the later of the two.
  - id: cam_opened_ms
    type: uint32_t
    initial_value: "0"
  - id: cam_last_ok_ms
    type: uint32_t
    initial_value: "0"
  # Settings: seconds without a touch before the panel sleeps, 0 for never.
  # Kept across restarts.
  - id: sleep_secs
    type: int
    restore_value: true
    initial_value: "120"
  # The open_app page showing, so the header's back button knows that Wi-Fi
  # goes back to Settings rather than to the launcher.
  - id: current_app
    type: int
    initial_value: "0"
  # Settings > Schedule: night mode on or off, and when the night starts (screen
  # off) and ends (screen on), in minutes after midnight. Kept across restarts.
  - id: schedule_enabled
    type: bool
    restore_value: true
    initial_value: "false"
  - id: schedule_off_min
    type: int
    restore_value: true
    initial_value: "60"
  - id: schedule_on_min
    type: int
    restore_value: true
    initial_value: "420"
  # Whether it is night now, and whether that just changed (schedule_check).
  - id: screen_night
    type: bool
    initial_value: "false"
  - id: screen_night_changed
    type: bool
    initial_value: "false"
  # The Wi-Fi page: whether the list holds networks from a scan (not the "tap
  # Scan" hint), and the network being joined.
  - id: wifi_scanned
    type: bool
    initial_value: "false"
  - id: wifi_target
    type: std::string
    initial_value: '""'

