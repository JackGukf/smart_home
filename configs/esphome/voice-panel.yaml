  - platform: online_image
    id: cam_image
    url: "http://192.168.0.83:1985/camera/front_door_camera.jpg"
    format: JPEG
    type: RGB565
    resize: 432x243
    buffer_size: 65536
    update_interval: never
    on_download_finished:
      - globals.set:
          id: cam_busy
          value: "false"
      - globals.set:
          id: cam_last_ok_ms
          value: !lambda return millis();
      - lvgl.image.update:
          id: cam_view
          src: cam_image
      - lvgl.widget.show: cam_view
      - if:
          condition:
            lambda: return id(cam_phase) == 0;
          then:
            # The last view is on screen at once; switch the same image to the
            # live frames, which the last-view request has already started.
            - lvgl.label.update:
                id: cam_tag
                text: "LAST VIEW"
            - lvgl.label.update:
                id: cam_time
                text: ""
            - globals.set:
                id: cam_phase
                value: "1"
            - online_image.set_url:
                id: cam_image
                url: !lambda 'return "http://192.168.0.83:1985/camera/" + id(cam_stream) + ".jpg";'
                update: false
          else:
            - lvgl.label.update:
                id: cam_tag
                text: "LIVE"
            - lvgl.label.update:
                id: cam_time
                text: !lambda |-
                  auto t = id(ha_time).now();
                  std::string text = t.is_valid() ? t.strftime("%H:%M:%S") : std::string("");
                  return text;
    # 404 on the last view (nothing saved yet) goes straight to live; the relay's
    # 503 while ffmpeg starts is normal for 2-3 s, so only 8 s with no picture at
    # all is worth saying so.
    on_error:
      - globals.set:
          id: cam_busy
          value: "false"
      - if:
          condition:
            lambda: return id(cam_phase) == 0;
          then:
            - globals.set:
                id: cam_phase
                value: "1"
            - online_image.set_url:
                id: cam_image
                url: !lambda 'return "http://192.168.0.83:1985/camera/" + id(cam_stream) + ".jpg";'
                update: false
      - if:
          condition:
            lambda: return millis() - std::max(id(cam_opened_ms), id(cam_last_ok_ms)) > 8000;
          then:
            - lvgl.label.update:
                id: cam_status
                text: "Camera not answering"

# Camera frames are fetched over plain HTTP from the board's camera relay.
http_request:
  timeout: 10s
  verify_ssl: false

text_sensor:
  # What casting is doing, worded by the dashboard ("Casting to LLANO-S450 ...").
  - platform: homeassistant
    id: tv_cast_text
    entity_id: switch.tv_cast
    attribute: text
    internal: true
    on_value:
      - lvgl.label.update:
          id: cast_status
          text: !lambda |-
            std::string text = (x.empty() || x == "unknown" || x == "unavailable") ? "Not reachable" : x;
            return text;
  # The weather at home (met.no through Home Assistant), for the launcher.
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.forecast_home
    internal: true
    on_value:
      - script.execute: weather_refresh
  # The network the panel is on, for Settings. scan_results is not shown; it is
  # here because it makes the Wi-Fi component keep every network a scan finds,
  # which the Wi-Fi page lists (panel/wifi_scan.h).
  - platform: wifi_info
    ssid:
      id: wifi_ssid
      internal: true
      on_value:
        - lvgl.label.update:
            id: settings_wifi_name
            text: !lambda |-
              std::string text = x.empty() ? "Not connected" : x;
              return text;
    scan_results:
      id: wifi_scan_results
      internal: true
  # The camera the hallway wall panel's Home view shows, as the dashboard
  # reports it (web_app.py, /api/wall-panel/camera).
  - platform: homeassistant
    id: wall_camera
    entity_id: sensor.wall_panel_camera
    internal: true
    on_value:
      - lvgl.label.update:
          id: wall_camera_name
          text: !lambda |-
            std::string text = (x.empty() || x == "unknown" || x == "unavailable") ? "..." : x;
            return text;
  # The camera the TV's Home view shows, as the cast reports it
  # (web_app.py, /api/tv-cast/camera).
  - platform: homeassistant
    id: tv_camera
    entity_id: sensor.tv_cast_camera
    internal: true
    on_value:
      - lvgl.label.update:
          id: tv_camera_name
          text: !lambda |-
            std::string text = (x.empty() || x == "unknown" || x == "unavailable") ? "..." : x;
            return text;
  - platform: homeassistant
    id: alarm_state
    entity_id: alarm_control_panel.duo_gong_neng_bao_jing_zhu_ji
    internal: true
    on_value:
      - script.execute: security_refresh
  - platform: homeassistant
    id: thermo_action
    entity_id: climate.my_ecobee
    attribute: hvac_action
    internal: true
    on_value:
      - script.execute: thermo_refresh

# How much memory the display leaves the wake word. Compare against the same
# sensors once the full GUI is in.
debug:
  update_interval: 30s

sensor:
  - platform: homeassistant
    id: weather_temp
    entity_id: weather.forecast_home
    attribute: temperature
    internal: true
    on_value:
      - script.execute: weather_refresh
  - platform: debug
    free:
      name: "Heap free"
      entity_category: diagnostic
    # The lowest internal heap since boot. "Heap free" is a snapshot every 30 s;
    # this catches the dips a voice session or a camera download cause.
    min_free:
      name: "Heap minimum free"
      entity_category: diagnostic
    block:
      name: "Heap largest block"
      entity_category: diagnostic
    psram:
      name: "PSRAM free"
      entity_category: diagnostic

  - !include
    file: panel/ha-dimmer-level.yaml
    vars: {key: kitchen, entity: light.kitchen_light_switch}
  - !include
    file: panel/ha-dimmer-level.yaml
    vars: {key: family, entity: light.family_room_switch}

  # The ecobee card: target and room temperature.
  - platform: homeassistant
    id: thermo_target
    entity_id: climate.my_ecobee
    attribute: temperature
    internal: true
    on_value:
      - script.execute: thermo_refresh
  - platform: homeassistant
    id: thermo_room
    entity_id: climate.my_ecobee
    attribute: current_temperature
    internal: true
    on_value:
      - script.execute: thermo_refresh
  - platform: homeassistant
    id: thermo_humidity
    entity_id: climate.my_ecobee
    attribute: current_humidity
    internal: true
    on_value:
      - script.execute: thermo_refresh
