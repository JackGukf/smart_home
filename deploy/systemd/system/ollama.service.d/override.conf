# Drop-in for Ollama's vendor unit (/etc/systemd/system/ollama.service), which
# is written by https://ollama.com/install.sh and rewritten by every update.
# Everything this board needs on top of it lives here, so an Ollama upgrade
# cannot silently drop it.
#
# Phase 3 step 1: Ollama is the first LLM back on the board because it unloads
# an idle model and gives the memory back -- the property that matters on a box
# whose day job is running the house.  See docs/local-ai.md, "Staging".

[Service]
# Loopback only, on purpose: there is no authentication in front of this.
# Reach it with an SSH tunnel rather than widening the bind address.
Environment="OLLAMA_HOST=127.0.0.1:11434"

# The whole reason Ollama goes first.  Spelled out rather than left to the
# default so the idle-unload soak measures a number we chose.
Environment="OLLAMA_KEEP_ALIVE=5m"

# One resident model at a time.  Two would be ~7 GiB on a board with ~8.9 GiB
# free and no swap.
Environment="OLLAMA_MAX_LOADED_MODELS=1"

# The board has 15 GiB and NO SWAP, so memory pressure does not degrade -- it
# hits a wall, and the kernel kills whichever process asks for memory next,
# which is very likely Home Assistant rather than the model that caused it.
# Qwen3-4B Q4_K_M is ~3.5 GiB loaded (docs/local-ai.md), so 5G is headroom
# rather than a working limit; if it is ever reached, being killed here instead
# of there is the entire point.
MemoryMax=5G
# Without this the unit restarts straight back into the wall it just hit.
OOMPolicy=stop

# The A720 big cores.  They are interleaved on this SoC: CIX's documented
# 0,5,6,7,8,9,10,11 includes a little core and drops a fast one, which costs 31%
# of generation throughput.  Confirmed by reading midr_el1 per core, not by a
# cpufreq glob, whose order misleads.  Leaving cpu2-5 unused also keeps the
# little cores available to Home Assistant while a prompt is running.
CPUAffinity=0 1 6 7 8 9 10 11
