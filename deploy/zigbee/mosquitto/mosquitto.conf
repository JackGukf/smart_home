# Mosquitto broker for the Zigbee stack.
#
# Loopback only, on purpose.  Zigbee2MQTT and Home Assistant both run with
# host networking on this board, so both reach the broker at 127.0.0.1 without
# it ever being exposed to the LAN.  This mirrors the Ollama decision recorded
# in CLAUDE.md: bind narrow, and treat widening as a deliberate design change
# rather than a convenience.
#
# If an off-box MQTT device ever needs the broker, add a SECOND listener with
# its own TLS and credentials.  Do not widen this one.

listener 1883 127.0.0.1

# Mosquitto 2.x already denies anonymous clients by default; saying so out loud
# means a future edit has to argue with the comment rather than a silent
# default.
allow_anonymous false
password_file /mosquitto/config/passwd

# Survive a restart without every device looking like it dropped off.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
