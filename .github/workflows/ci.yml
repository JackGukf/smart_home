# The tests, on every push and pull request (action list C3).
#
# Python 3.12, as on the board; America/Vancouver, as on the board, so a test
# that reads local time behaves as it does there. Node runs the tests that
# execute app.js, and `node --check` rejects a syntax error in it. The Matter
# SDK submodule is not needed and is not fetched.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: America/Vancouver
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/python/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        # The annotate plugin turns each failed test into a GitHub annotation, which
        # (unlike the logs) can be read without signing in.
        run: python -m pip install -r requirements-dev.txt pytest-github-actions-annotate-failures

      - name: JavaScript syntax
        run: node --check src/python/web_static/app.js

      - name: Tests
        run: python -m pytest -q -rfE
